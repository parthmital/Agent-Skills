# Tool configuration only: this repository is not a Python package.

[tool.ruff]
target-version = "py311"
# Markdown is formatted by Prettier, and ruff covers the Python helper scripts and tests.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
